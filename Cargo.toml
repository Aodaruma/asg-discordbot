[package]
name = "asg-discordbot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
dotenv = "0.15"
futures = "0.3"
hound = "3"
jpholiday = "0.1.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "chrono", "client", "gateway", "http", "model", "rustls_backend", "utils"] }
songbird = { version = "0.6.0", features = ["receive", "serenity", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
